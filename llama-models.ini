[*]
ctx-size = 131072
gpu-layers = all
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
parallel = 1
device = ROCm0,ROCm1,ROCm2
# Placement is evaluated per preset by scripts/gpu_placement.py against
# config/gpu-placement.json; see docs/reference/GPU-EXECUTION-AND-MODEL-LOADING.md.
# An equal three-way split is the default because it is the safe placement for a
# preset added here without its own evaluation. The previous 3,6,2 default sized
# every model to card capacity, which gave the throttling V620 the majority share
# of every model in the catalog.
tensor-split = 1,1,1
jinja = 1
load-mode = none
reasoning = off

[ridge]
model = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-Ridge-3.7bpw.gguf
# 20.87 GiB at 131,072 context: fits on the two RX 6900 XTs with the V620 unused.
tensor-split = 1,0,1
spec-type = draft-mtp
spec-draft-n-max = 2

[heretic]
model = /home/typhoon/git/frankenstein-llm/models/RVN-Q6_K-multilingual-mtp.gguf
spec-type = draft-mtp
spec-draft-n-max = 2

[obliterated]
model = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-OBLITERATED-Q6_K.gguf
# These weights ship a 506-character chat template that has no `tools` branch and
# no `tool` role branch, so a tools payload was silently discarded before the
# model ever saw it and no native tool call could be emitted. The weights are
# tool-trained: the vocabulary is the same 248,320 tokens as ridge and heretic and
# carries <tool_call>, </tool_call>, <tool_response> and </tool_response>. The
# replacement is not written by hand -- it is the template extracted verbatim from
# ridge, which is byte-identical to heretic's
# (sha256 c3cf9e34abf4f9e36c2d72165aa9c132d3e2a725b6c2586aaa3a8af9d7a81041).
chat-template-file = /home/typhoon/git/frankenstein-llm/config/chat-templates/qwen3.8-27b-tools.jinja
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.2
repeat-penalty = 1.15

[obliterated-vision]
model = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-OBLITERATED-Q6_K.gguf
mmproj = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-OBLITERATED-mmproj-bf16.gguf
# The projector is pinned, not split, so it belongs on a card the model already
# uses; on ROCm1 it was the only reason this preset touched the V620 at all.
mmproj-device = ROCm0
# Same weights, same stripped template, same correction. The Qwen3.8 template
# renders image parts as <|vision_start|><|image_pad|><|vision_end|>, so it covers
# this preset's multimodal path rather than only its text path.
chat-template-file = /home/typhoon/git/frankenstein-llm/config/chat-templates/qwen3.8-27b-tools.jinja
# 23.18 GiB at 32,768 context. The 0.87 GiB projector is pinned to ROCm0 and is
# held back from that card's share before the split is chosen, which is why this
# is 5,0,4 rather than the 3,0,2 a split-only calculation produces.
tensor-split = 5,0,4
ctx-size = 32768
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.2
repeat-penalty = 1.15

