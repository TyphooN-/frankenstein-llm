[*]
ctx-size = 131072
gpu-layers = all
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
parallel = 1
device = ROCm0,ROCm1,ROCm2
# Placement is evaluated per preset by scripts/gpu_placement.py against
# config/gpu-placement.json; see docs/reference/GPU-EXECUTION-AND-MODEL-LOADING.md.
# An equal three-way split is the default because it is the safe placement for a
# preset added here without its own evaluation. The previous 3,6,2 default sized
# every model to card capacity, which gave the throttling V620 the majority share
# of every model in the catalog.
tensor-split = 1,1,1
jinja = 1
mmap = 0
reasoning = off

[ridge]
model = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-Ridge-3.7bpw.gguf
# 20.87 GiB at 131,072 context: fits on the two RX 6900 XTs with the V620 unused.
tensor-split = 1,0,1
spec-type = draft-mtp
spec-draft-n-max = 2

[heretic]
model = /home/typhoon/git/frankenstein-llm/models/RVN-Q6_K-multilingual-mtp.gguf
spec-type = draft-mtp
spec-draft-n-max = 2

[obliterated]
model = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-OBLITERATED-Q6_K.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.2
repeat-penalty = 1.15

[obliterated-vision]
model = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-OBLITERATED-Q6_K.gguf
mmproj = /home/typhoon/git/frankenstein-llm/models/Qwen3.8-27B-OBLITERATED-mmproj-bf16.gguf
# The projector is pinned, not split, so it belongs on a card the model already
# uses; on ROCm1 it was the only reason this preset touched the V620 at all.
mmproj-device = ROCm0
# 23.18 GiB at 32,768 context. The 0.87 GiB projector is pinned to ROCm0 and is
# held back from that card's share before the split is chosen, which is why this
# is 5,0,4 rather than the 3,0,2 a split-only calculation produces.
tensor-split = 5,0,4
ctx-size = 32768
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.2
repeat-penalty = 1.15

[fable]
model = /home/typhoon/git/frankenstein-llm/models/Qwen3.6-27B-Fable-Fus-711-UnHeretic-NM-DAU-NEO-MAX-NEO-AMD-MTP-Q6_K.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-size = 65536

[phr00ty]
model = /home/typhoon/git/frankenstein-llm/models/Phr00tyMix-v4-32B-imat-Q6_K.gguf
ctx-size = 65536
temp = 1.5
min-p = 0.1

[qwen3-embedding-8b]
model = /home/typhoon/git/frankenstein-llm/models/embedding/Qwen3-Embedding-8B-Q6_K.gguf
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
# 5.79 GiB and no persistent KV cache: one card, no split, no cross-device hops.
tensor-split = 1,0,0
embedding = 1
pooling = last
embd-normalize = 2
flash-attn = off
cache-type-v = f16

[qwen3-reranker-8b]
model = /home/typhoon/git/frankenstein-llm/models/reranker/Qwen3-Reranker-8B-Q6_K.gguf
ctx-size = 4096
batch-size = 1024
ubatch-size = 1024
# 5.79 GiB and no persistent KV cache: one card, no split.
tensor-split = 1,0,0
reranking = 1
pooling = rank
flash-attn = off
cache-type-v = f16

[qwen25-coder-7b-fim]
model = /home/typhoon/git/frankenstein-llm/models/fim/qwen2.5-coder-7b-q8_0.gguf
# 8.47 GiB at 32,768 context: one card holds the whole preset.
tensor-split = 1,0,0
ctx-size = 32768
batch-size = 1024
ubatch-size = 512
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3-coder-next]
model = /home/typhoon/git/frankenstein-llm/models/repository-agent/Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
ctx-size = 65536
# 46.77 GiB across four shards: the only preset here that genuinely needs all
# three cards. The RX 6900 XTs are filled to their working headroom and the
# remaining 21.30 GiB goes to the V620, rather than the reverse.
tensor-split = 5,8,4
temp = 0.2
repeat-penalty = 1.05

[gemma4-heretic]
model = /home/typhoon/git/frankenstein-llm/models/gemma4-heretic/Gemma-4-12B-it-heretic-Q6_K.gguf
ctx-size = 32768
# 14.88 GiB upper bound at 32,768 context. Sliding-window attention makes that a
# generous over-estimate, but even the upper bound sits on the RX 6900 XTs.
tensor-split = 1,0,1
temp = 0.7

[gemma4-heretic-vision]
model = /home/typhoon/git/frankenstein-llm/models/gemma4-heretic/Gemma-4-12B-it-heretic-Q6_K.gguf
mmproj = /home/typhoon/git/frankenstein-llm/models/gemma4-heretic/mmproj-Gemma-4-12B-it-BF16.gguf
mmproj-device = ROCm0
ctx-size = 16384
# 12.00 GiB upper bound plus a 0.16 GiB projector: one card holds all of it.
tensor-split = 1,0,0
temp = 0.7
