[phr00ty]
model = /home/typhoon/git/frankenstein-llm/models/Phr00tyMix-v4-32B-imat-Q6_K.gguf
# The shipped chat template is 88 characters and is broken well beyond tool calls:
#   {{- '<|im_start|>system\n' }}{{- messages[0]['content'] }}{{- '<|im_start|>assistant\n' }}
# It renders only messages[0] and discards every later turn, never emits <|im_end|>
# even though this model's EOS *is* <|im_end|> (151645, the Qwen2.5-Instruct
# convention), ignores add_generation_prompt, and has no tools branch. Single-turn
# prompts still answer, which is why the router gate's PONG and JSON checks passed
# while the tool call could not. Multi-turn serving was silently truncated.
# The replacement is the template extracted verbatim from the in-repository
# qwen2.5-coder-7b weights, which are the same `qwen2` architecture and carry
# identical special-token ids: <|im_start|> 151644, <|im_end|> 151645,
# <tool_call> 151657, </tool_call> 151658
# (sha256 cd8e9439f0570856fd70470bf8889ebd8b5d1107207f67a5efb46e342330527f).
chat-template-file = /home/typhoon/git/frankenstein-llm/config/chat-templates/qwen2.5-tools.jinja
ctx-size = 65536
temp = 1.5
min-p = 0.1

