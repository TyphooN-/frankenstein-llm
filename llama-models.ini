[gemma4-heretic]
model = /home/typhoon/git/frankenstein-llm/models/gemma4-heretic/Gemma-4-12B-it-heretic-Q6_K.gguf
ctx-size = 32768
# Measured, not estimated: this preset loads on ROCm0 alone at 32,768 context
# holding 9.88 GiB, inside that card's 13.98 GiB of working headroom, and
# unloads to its baseline. scripts/gpu_placement.py still proposes 1,0,1 here
# because it charges every block the full context; Gemma 4's 1,024-token
# sliding window is why the 14.88 GiB upper bound overstates this one by five
# gigabytes. Rule 1 of the placement policy -- one preferred card when the model
# fits on one -- therefore applies, and the divergence from the proposal is the
# over-estimate, not a different policy.
#
# It is worth taking, and it costs nothing. Layer split is pipelined, so a
# two-card placement pays a device hop on every decoded token: measured on kernel
# 7.2.3-273-tkg-eevdf-llvm at pp512/tg128, r=3, these weights decode at
# 23.60 tok/s on 1,0,1 against 40.30 tok/s on 1,0,0, a 70.8% gain. Prefill does
# parallelise across cards, so it was the figure expected to move the other way;
# over three 1,0,0 runs it did not, averaging 935.8 tok/s against 928.3 on the
# pair. For a 512-token prompt and a 128-token reply that is 5.98 s against
# 3.72 s end to end.
tensor-split = 1,0,0
temp = 0.7

[gemma4-heretic-vision]
model = /home/typhoon/git/frankenstein-llm/models/gemma4-heretic/Gemma-4-12B-it-heretic-Q6_K.gguf
mmproj = /home/typhoon/git/frankenstein-llm/models/gemma4-heretic/mmproj-Gemma-4-12B-it-BF16.gguf
mmproj-device = ROCm0
ctx-size = 16384
# 12.00 GiB upper bound plus a 0.16 GiB projector: one card holds all of it.
tensor-split = 1,0,0
temp = 0.7

[qwen38-coder]
# ISTA-DASLab Qwen3.8-Flash-Next GSQ-RCO Coder IQ1_M, revision 5348543e: qwen4exp,
# 256 of 512 experts per layer kept (RCO expert pruning targeted at code, agentic
# tool use and vision). Shard 1 (27.58 GiB) is the transformer; shard 2 (26.82 GiB)
# is the per-layer n-gram lookup table, which the publisher states need not be
# resident, so it stays on CPU via mmap and only the transformer is split.
# Candidate preset from the 2026-09-29 intake: not qualified until router-models
# passes for this alias.
model = /home/typhoon/git/frankenstein-llm/models/qwen38-flash-next-coder/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
ctx-size = 65536
override-tensor = per_layer_token_embd=CPU
# Another qwen4exp publisher reports quantized KV crashing this architecture; the
# attention KV is small here (2 KV heads), so f16 costs little.
cache-type-k = f16
cache-type-v = f16
# gpu_placement.py cannot see override-tensor and counts both shards (54.40 GiB),
# so config/gpu-placement.json carries this preset's measured residency instead:
# 31.71 GiB net at 65,536 context (loaded 2026-09-29 at 9,5,8: 12.86 / 7.59 / 12.21 GiB).
# Against that figure the policy proposes an equal split, 10.57 GiB per card.
tensor-split = 1,1,1
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0

