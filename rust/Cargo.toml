[package]
name = "frankenctl"
version = "0.1.0"
edition = "2021"
description = "Rust control plane for the Frankenstein LLM stack"
license = "MIT OR Apache-2.0"

[[bin]]
name = "frankenctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
