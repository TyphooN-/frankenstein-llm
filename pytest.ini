[pytest]
# Collection scope for this repository's own offline tests.
#
# Without this file, `pytest` at the repository root walks into the untracked
# upstream ComfyUI checkout under tools/ and into the local virtualenvs, and
# reports dozens of collection errors that say nothing about this workspace.
# It also collects verification/repository-agent/fixture/, whose test suite is
# the *oracle* for the repository-agent gate: calculator.add is defective on
# purpose, so those three tests are supposed to fail until a candidate model
# repairs the fixture inside its own disposable copy. Reported as project test
# failures they would train everyone to ignore a red suite.
#
# The gate itself is unaffected: it copies the fixture to a temporary directory
# and runs `python3 -m unittest` there, never through this configuration.
testpaths = verification
norecursedirs =
    .git
    logs
    models
    tools
    venvs
    verification/repository-agent/fixture
    verification/**/evidence
